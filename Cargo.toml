[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app", "crates/keepalive"]

[workspace.package]
version = "0.4.2"
edition = "2024"
publish = false
authors = ["AbyssRei <AbyssRei@outlook.com>"]

[workspace.dependencies]
scheduled-task-core = { path = "crates/core" }
scheduled-task-keepalive = { path = "crates/keepalive" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
regex = "1"
jiff = { version = "0.2", features = ["serde"] }
async-channel = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
directories = "6"

[profile.release]
lto = "thin"
